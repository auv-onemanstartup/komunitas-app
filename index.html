<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Komunitas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#14181f; --mut:#5b6472; --line:#e3e6eb; --pri:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --card:#181c22; --ink:#e8ebef; --mut:#9aa3af; --line:#2a3039; --pri:#2dd4bf; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #atur { max-width: 480px; margin: 0 auto; padding: 32px 16px; display: none; }
  #atur img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  p { color: var(--mut); margin: 6px 0; }
  textarea, input { width: 100%; margin-top: 6px; }
  textarea { min-height: 84px; }
  textarea, input { padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 14px/1.4 ui-monospace, monospace; }
  button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 12px; background: var(--pri); color: #fff; font: 600 15px system-ui, sans-serif; }
  code { word-break: break-all; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; }
  #memuat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--mut); }
  #memuat img { width: 64px; height: 64px; border-radius: 16px; animation: denyut 1.4s ease-in-out infinite; }
  #memuat a { color: var(--pri); font-size: 13px; display: none; }
  @keyframes denyut { 50% { opacity: .55; transform: scale(.94); } }
</style>
</head>
<body>
<div id="memuat"><img src="ikon-192.png" alt=""><span>Memuat…</span><a href="?atur=1" id="gantiLink">Tidak terbuka? Ganti link</a></div>
<iframe id="app" title="Komunitas" allow="clipboard-write"></iframe>
<section id="atur">
  <img src="ikon-192.png" alt="">
  <h1>Komunitas</h1>
  <p>1. Tempel <b>link web app</b> (URL berakhiran <code>/exec</code> dari Apps Script → Terapkan):</p>
  <textarea id="link" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></textarea>
  <p>2. Isi <b>kunci</b> (KUNCI dari kunci.txt):</p>
  <input id="kunci" placeholder="kunci" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="err" id="err"></div>
  <button id="simpan">Simpan & buka</button>
  <p style="font-size:13px">Disimpan hanya di HP ini. Untuk mengganti nanti, tekan "Ganti link" saat memuat.</p>
</section>
<script>
  const KUNCI_SIMPAN = 'komunitas-link';
  const ambil = () => { try { return localStorage.getItem(KUNCI_SIMPAN) || ''; } catch (e) { return ''; } };
  const simpan = (v) => { try { localStorage.setItem(KUNCI_SIMPAN, v); return true; } catch (e) { return false; } };
  // URL web app biasa atau akun Google Workspace (/a/domain/macros/…)
  const RE_EXEC = /^https:\/\/script\.google\.com\/(?:a\/[^/\s]+\/)?macros\/s\/[\w-]+\/exec/;
  const cocok = (v) => RE_EXEC.test(v) && /[?&]k=[^&\s]+/.test(v);
  const $ = (s) => document.querySelector(s);
  const bersih = (v) => String(v || '').replace(/\s+/g, '');
  // pisahkan link & kunci (kalau link yang ditempel sudah berisi ?k=)
  function urai(v) {
    v = bersih(v);
    const m = /[?&]k=([^&#]+)/.exec(v);
    return { dasar: v.replace(/[?#].*$/, ''), kunci: m ? decodeURIComponent(m[1]) : '' };
  }

  function buka(link) {
    $('#atur').style.display = 'none';
    $('#memuat').style.display = 'flex';
    const f = $('#app');
    f.onload = () => { $('#memuat').style.display = 'none'; f.style.display = 'block'; };
    f.src = link;
    setTimeout(() => { $('#gantiLink').style.display = 'block'; }, 12000);
  }
  function atur(pesan) {
    $('#memuat').style.display = 'none';
    $('#atur').style.display = 'block';
    const u = urai(ambil());
    $('#link').value = u.dasar; $('#kunci').value = u.kunci;
    $('#err').textContent = pesan || '';
  }
  $('#link').addEventListener('input', () => {
    const u = urai($('#link').value);
    if (u.kunci) { $('#kunci').value = u.kunci; $('#link').value = u.dasar; }
  });
  $('#simpan').onclick = () => {
    const u = urai($('#link').value);
    const kunci = bersih($('#kunci').value) || u.kunci;
    const err = (t) => ($('#err').textContent = t);
    if (/\/dev\b/.test(u.dasar)) return err('Ini URL /dev (untuk uji). Pakai URL yang berakhiran /exec dari Terapkan → Kelola deployment.');
    if (!RE_EXEC.test(u.dasar)) return err('Link belum benar. Harus diawali https://script.google.com/ dan berakhiran /exec.');
    if (!kunci) return err('Kunci belum diisi. Salin KUNCI dari kunci.txt.');
    const link = u.dasar + '?k=' + encodeURIComponent(kunci);
    simpan(link);
    history.replaceState(null, '', location.pathname);
    buka(link);
  };

  const p = new URLSearchParams(location.search);
  const tersimpan = ambil();
  if (p.has('atur') || !cocok(tersimpan)) atur(); else buka(tersimpan);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
